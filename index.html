<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cute Rabbit</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            background: linear-gradient(#87CEEB 0%, #87CEEB 65%, #62c462 65%);
        }

        .rabbit {
            position: relative;
            width: 280px;
            height: 420px;
        }

        /* Ears */
        .ear {
            position: absolute;
            width: 75px;
            height: 190px;
            background: white;
            border: 4px solid #333;
            border-radius: 50%;
            top: 0;
        }

        .ear::after {
            content: "";
            position: absolute;
            width: 35px;
            height: 140px;
            background: pink;
            border-radius: 50%;
            top: 20px;
            left: 16px;
        }

        .left-ear {
            left: 40px;
            transform: rotate(-10deg);
        }

        .right-ear {
            right: 40px;
            transform: rotate(10deg);
        }

        /* Head */
        .head {
            position: absolute;
            width: 210px;
            height: 180px;
            background: white;
            border: 4px solid #333;
            border-radius: 50%;
            top: 130px;
            left: 35px;
            z-index: 2;
        }

        /* Eyes */
        .eye {
            position: absolute;
            width: 22px;
            height: 28px;
            background: #222;
            border-radius: 50%;
            top: 65px;
        }

        .left-eye {
            left: 50px;
        }

        .right-eye {
            right: 50px;
        }

        /* Nose */
        .nose {
            position: absolute;
            width: 25px;
            height: 18px;
            background: #ff8fab;
            border-radius: 50%;
            top: 100px;
            left: 88px;
        }

        /* Body */
        .body {
            position: absolute;
            width: 230px;
            height: 180px;
            background: white;
            border: 4px solid #333;
            border-radius: 50%;
            bottom: 0;
            left: 25px;
        }

        /* Hands */
        .hand {
            position: absolute;
            width: 55px;
            height: 100px;
            background: white;
            border: 4px solid #333;
            border-radius: 50%;
            top: 40px;
        }

        .left-hand {
            left: -25px;
            transform: rotate(25deg);
        }

        .right-hand {
            right: -25px;
            transform: rotate(-25deg);
        }

        /* Text */
        h1 {
            position: absolute;
            top: 40px;
            font-family: Arial, sans-serif;
            color: white;
            text-shadow: 2px 2px 5px #333;
        }

        .shadow {
            position: absolute;
            width: 250px;
            height: 30px;
            background: rgba(0,0,0,0.2);
            border-radius: 50%;
            bottom: -15px;
            left: 15px;
        }
    </style>
</head>

<body>

    <h1>🐰 Cute Rabbit</h1>

    <div class="rabbit">

        <div class="ear left-ear"></div>
        <div class="ear right-ear"></div>

        <div class="head">
            <div class="eye left-eye"></div>
            <div class="eye right-eye"></div>
            <div class="nose"></div>
        </div>

        <div class="body">
            <div class="hand left-hand"></div>
            <div class="hand right-hand"></div>
        </div>

        <div class="shadow"></div>

    </div>

</body>
</html>
